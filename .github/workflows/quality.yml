name: Quality and Production verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_live_gemini:
        description: 'Run up to 8 actual Gemini calls using synthetic Production PDFs'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      GEMINI_API_KEY: ''
      PLAYWRIGHT_SERVER_MODE: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:runtime
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-browser-failure
          path: test-results/playwright
          retention-days: 7
  production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:production -- --sha "$GITHUB_SHA"
      - run: node scripts/report-summary.mjs deployment
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: test-results/deployment/report.json
          retention-days: 7
  live-gemini:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.verify_live_gemini) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-live-gemini]')))
    needs: [quality, production]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:production
      - run: node scripts/report-summary.mjs live
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-synthetic-gemini-report
          path: test-results/live-gemini-production/report.json
          retention-days: 7
